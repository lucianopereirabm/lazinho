<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#B30000">
<title>Lazinho Vendas — Gestão</title>
<link rel="icon" href="img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="gestao">
<header class="top"><div class="top-in">
  <div class="brand"><img class="brand-logo" src="img/logo.png" alt="Lazinho"><span><b>Lazinho</b><small>Vendas · Gestão</small></span></div>
  <div class="row" style="gap:6px"><div class="who" id="quem"></div><button class="btn ghost sm" id="atualiza" hidden>↻ Atualizar</button><button class="btn ghost sm" id="sair" hidden>Sair</button></div>
</div></header>

<section id="g-login" class="login" hidden>
  <div class="logo"><img src="img/logo.png" alt="Pão de Queijo Lazinho"><span>Gestão de vendas</span></div>
  <form id="f-adm" class="stack">
    <label class="field"><span>E-mail do administrador</span><input type="email" id="adm-email" autocomplete="username" autocapitalize="none"></label>
    <label class="field"><span>Senha</span><input type="password" id="adm-senha" autocomplete="current-password"></label>
    <span id="adm-msg" class="muted small" style="min-height:18px"></span>
    <button class="btn primary big" type="submit">Entrar</button>
    <button class="btn ghost" type="button" id="adm-esqueci">Esqueci a senha</button>
  </form>
  <p class="muted small" style="text-align:center"><a href="index.html">Voltar ao app do vendedor</a></p>
</section>

<div id="g-app" hidden>
  <nav class="menu" id="menu">
    <button data-t="pedidos" aria-current="true">Pedidos</button>
    <button data-t="visitas">Visitas</button>
    <button data-t="vendedores">Vendedores</button>
    <button data-t="carga">Atualizar tudo</button>
  </nav>
  <main id="g-main"></main>
</div>
<script type="module" src="js/gestao.js"></script>
</body>
</html>
